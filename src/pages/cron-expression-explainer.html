<div class="card tool">
  <div class="grid2">
    <div><label for="expr">Cron expression</label><input id="expr" value="*/15 9-17 * * 1-5" spellcheck="false" style="font-family:ui-monospace,monospace"></div>
    <div><label for="tz">Show times in</label><select id="tz"><option value="local">My local time</option><option value="utc">UTC</option></select></div>
  </div>
  <p class="muted">Examples:
    <button class="btn secondary" type="button" data-cron="0 9 * * 1-5">Weekdays 09:00</button>
    <button class="btn secondary" type="button" data-cron="0 0 1 * *">Monthly</button>
    <button class="btn secondary" type="button" data-cron="*/5 * * * *">Every 5 min</button>
    <button class="btn secondary" type="button" data-cron="30 2 * * 0">Sundays 02:30</button>
  </p>
  <div class="result" id="out" aria-live="polite"></div>
</div>
