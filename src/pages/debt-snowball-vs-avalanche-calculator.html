 "prose": "<h2>How the snowball and avalanche are calculated</h2><p>Each month, interest is added to every open balance at the annual rate divided by 12. Every debt then receives its minimum payment. Whatever is left of your monthly amount goes to the target debt: the smallest balance (snowball) or the highest rate (avalanche). When a debt is cleared, the money that was going to it rolls into the next target in the same month, so your total monthly payment stays the same until you are debt-free.</p><h2>Which one should you choose?</h2><p>If the interest difference is small, pick the snowball if quick wins will keep you going. If one debt carries a much higher rate than the rest (a store card or credit card next to a car loan, for example), the avalanche usually saves a meaningful amount. Either method beats paying only the minimums. The single biggest lever is the monthly amount: try adding R500 and watch the debt-free date move.</p><h2>Getting help if you are over-indebted</h2><p>If you cannot cover the minimums, the <a href='https://www.ncr.org.za/index.php/departments/debt-counselling' target='_blank' rel='noopener'>National Credit Regulator</a> explains debt counselling (debt review), a debt relief measure provided for in the <a href='https://www.gov.za/documents/national-credit-act' target='_blank' rel='noopener'>National Credit Act 34 of 2005</a>. Use a counsellor who is registered with the NCR.</p><h2>Want the full month-by-month plan?</h2><p>The <a href='https://payhip.com/b/3q49k' target='_blank' rel='noopener'>Debt Payoff Planner</a> (Excel and Google Sheets) handles up to 15 debts, compares snowball, avalanche and your own custom order, and shows a month-by-month schedule, a budget tab and a payment log. To track spending alongside it, see the <a href='https://payhip.com/b/YAogS' target='_blank' rel='noopener'>Finance Tracker</a>.</p><p class='muted'>Estimate only, not financial advice. Sources: National Credit Regulator, Debt Counselling; National Credit Act 34 of 2005 (gov.za). Related: <a href='/home-loan-calculator/'>home loan calculator</a>, <a href='/compound-interest-calculator/'>compound interest calculator</a>.</p>"
