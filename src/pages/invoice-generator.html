<div class="card tool no-print">
  <div class="grid2">
    <div><label for="from">From (your business name, address, email)</label><textarea id="from" style="min-height:90px" placeholder="Your Business&#10;Address&#10;email@example.com"></textarea></div>
    <div><label for="to">Bill to</label><textarea id="to" style="min-height:90px" placeholder="Client name&#10;Address"></textarea></div>
  </div>
  <div class="grid3">
    <div><label for="number">Invoice number</label><input id="number"></div>
    <div><label for="date">Invoice date</label><input id="date" type="date"></div>
    <div><label for="due">Due date</label><input id="due" type="date"></div>
    <div><label for="cur">Currency</label><select id="cur"><option>ZAR</option><option>USD</option><option>EUR</option><option>GBP</option><option>AUD</option><option>CAD</option><option>NGN</option><option>KES</option><option>INR</option></select></div>
    <div><label for="discount">Discount (%)</label><input id="discount" type="number" min="0" max="100" step="any"></div>
    <div><label for="vatrate">VAT rate (%)</label><input id="vatrate" type="number" step="any"></div>
  </div>
  <label><input id="vaton" type="checkbox" style="width:auto"> Charge VAT (tax invoice)</label>
  <div><label for="vatno">Your VAT number (optional)</label><input id="vatno"></div>
  <label>Line items</label>
  <table class="data inv-lines"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th class="num">Amount</th><th></th></tr></thead><tbody id="lines"></tbody></table>
  <button class="btn secondary" id="add" type="button">+ Add line</button>
  <table class="data" style="max-width:360px;margin-left:auto"><tbody id="totals"></tbody></table>
  <div class="grid2"><div><label for="bank">Payment details</label><textarea id="bank" style="min-height:80px" placeholder="Bank, account number, branch code / PayPal"></textarea></div><div><label for="notes">Notes</label><textarea id="notes" style="min-height:80px" placeholder="Thank you for your business."></textarea></div></div>
  <button class="btn" id="print" type="button">Print / Save as PDF</button><button class="btn secondary" id="clear" type="button">Clear</button>
</div>
<div class="card"><p class="muted no-print">Preview</p><div id="invoice-preview"></div></div>
