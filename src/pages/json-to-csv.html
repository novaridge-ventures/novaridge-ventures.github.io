<div class="card tool">
  <div class="grid3">
    <div><label for="dir">Direction</label><select id="dir"><option value="j2c">JSON → CSV</option><option value="c2j">CSV → JSON</option></select></div>
    <div><label for="delim">Delimiter</label><select id="delim"><option value=",">Comma ,</option><option value=";">Semicolon ;</option><option value="tab">Tab</option><option value="|">Pipe |</option><option value="auto">Auto-detect (CSV input)</option></select></div>
    <div><label for="file">Or open a file</label><input id="file" type="file" accept=".json,.csv,.txt,application/json,text/csv"></div>
  </div>
  <label><input id="flat" type="checkbox" checked style="width:auto"> Flatten nested objects</label>
  <label for="in" id="inlabel">Paste JSON</label>
  <textarea id="in" spellcheck="false">[{"id":1,"name":"Thabo","address":{"city":"Durban","code":"4001"},"tags":["vip","za"]},{"id":2,"name":"Anna, \"AJ\"","address":{"city":"Cape Town","code":"8001"},"tags":[]}]</textarea>
  <p id="err" class="err"></p>
  <pre class="out" id="out"></pre>
  <button class="btn" id="copy" type="button">Copy</button><button class="btn secondary" id="dl" type="button">Download</button>
</div>
