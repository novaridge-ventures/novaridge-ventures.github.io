<div class="card tool">
  <label for="sql">SQL</label>
  <textarea id="sql" spellcheck="false">select o.id, c.name, sum(l.qty*l.price) total from orders o inner join customers c on c.id=o.customer_id left join order_lines l on l.order_id=o.id where o.created_at >= '2026-01-01' and c.country in ('ZA','NA') group by o.id, c.name having sum(l.qty*l.price) > 1000 order by total desc;</textarea>
  <div class="grid3">
    <div><label for="mode">Mode</label><select id="mode"><option value="fmt">Beautify</option><option value="min">Minify</option></select></div>
    <div><label for="indent">Indent</label><select id="indent"><option value="4">4 spaces</option><option value="2">2 spaces</option><option value="tab">Tab</option></select></div>
    <div><label><input id="upper" type="checkbox" checked style="width:auto"> UPPERCASE keywords</label></div>
  </div>
  <p id="err" class="err"></p>
  <pre class="out" id="out"></pre>
  <button class="btn" id="copy" type="button">Copy</button>
</div>
